<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせを見る</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #f3f4f6; color: #111; }
  </style>
</head>
<body class="min-h-screen p-6">

  <!-- ヘッダー -->
  <header class="max-w-4xl mx-auto bg-white border-2 border-gray-300 rounded-2xl p-6 mb-6 flex justify-between items-center">
    <div>
      <p class="text-sm text-gray-500">いま見ている画面</p>
      <h1 class="text-2xl font-bold">📩 お問い合わせを見る</h1>
    </div>
    <a href="dashboard.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-5 rounded-lg text-lg">
      ← 戻る
    </a>
  </header>

  <!-- メッセージ表示エリア -->
  <div id="message" class="max-w-4xl mx-auto mb-4 hidden"></div>

  <!-- 案内 -->
  <div class="max-w-4xl mx-auto bg-orange-50 border-2 border-orange-200 rounded-2xl p-6 mb-6 flex items-center justify-between gap-4">
    <p class="text-lg leading-relaxed">
      お客様から届いたお問い合わせの一覧です。<br>
      返事が終わったら <span class="font-bold">「✓ 対応済みにする」</span> ボタンを押してください。
    </p>
    <button onclick="refresh()" class="shrink-0 bg-white hover:bg-gray-100 border-2 border-orange-300 text-orange-700 font-bold py-3 px-5 rounded-lg text-base">
      🔄 更新
    </button>
  </div>

  <!-- 件数サマリ -->
  <div class="max-w-4xl mx-auto bg-white border-2 border-gray-300 rounded-2xl p-6 mb-6 text-center">
    <p class="text-lg text-gray-700 mb-1">まだ返事していない</p>
    <p id="count-pending" class="text-5xl font-bold text-orange-600 mb-1">0 件</p>
    <p id="count-total" class="text-base text-gray-500">（ぜんぶで 0 件）</p>
  </div>

  <!-- フィルター -->
  <div class="max-w-4xl mx-auto bg-white border-2 border-gray-300 rounded-2xl p-4 mb-8">
    <label class="flex items-center gap-3 cursor-pointer text-lg select-none">
      <input id="show-all" type="checkbox" class="w-6 h-6 cursor-pointer accent-orange-500">
      <span>対応済みのお問い合わせも表示する</span>
    </label>
  </div>

  <!-- お問い合わせ一覧 -->
  <section id="contact-list" class="max-w-4xl mx-auto space-y-4">
    <p class="text-center text-gray-500 py-12 text-lg bg-white border-2 border-gray-300 rounded-2xl">読み込み中...</p>
  </section>

  <!-- 戻るボタン（下にも） -->
  <div class="max-w-4xl mx-auto mt-8 text-center">
    <a href="dashboard.html" class="inline-block bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 px-8 rounded-lg text-xl">
      ← 管理画面トップに戻る
    </a>
  </div>

  <!-- モーダル -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
    <div class="bg-white border-4 border-orange-400 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl">

      <div class="flex justify-between items-center mb-4 pb-4 border-b-2 border-gray-200">
        <h2 class="text-2xl font-bold">📩 お問い合わせの内容</h2>
        <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg text-lg">
          ✕ 閉じる
        </button>
      </div>

      <div id="modal-body" class="space-y-4 text-base"></div>

      <div class="mt-6 pt-4 border-t-2 border-gray-200 space-y-3">
        <a id="modal-mailto" href="#" class="block w-full bg-orange-500 hover:bg-orange-600 text-white text-xl font-bold py-4 rounded-lg shadow text-center">
          ✉️ このお客様にメールで返信する
        </a>
        <button id="modal-toggle" onclick="toggleHandledFromModal()" class="w-full text-white text-xl font-bold py-4 rounded-lg shadow"></button>
        <button onclick="closeModal()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg text-lg">
          閉じる
        </button>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../lib/adminClient.js"></script>
  <script>
    const FILTER_KEY = 'admin_contacts_filter_v1';
    const client = new AdminClient(ADMIN_WEB_APP);

    let contacts = [];
    let showAll = localStorage.getItem(FILTER_KEY) === '1';
    let modalOpenRowIndex = null;

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function isHandled(c) { return c['対応'] === '済'; }

    function formatTimestamp(raw) {
      if (!raw) return '';
      const d = new Date(raw);
      if (isNaN(d.getTime())) return String(raw);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${day}  ${hh}:${mm}`;
    }

    function sortContacts(list) {
      // 未対応を上、対応済みを下。同状態内ではタイムスタンプ降順
      return list.slice().sort((a, b) => {
        const ah = isHandled(a), bh = isHandled(b);
        if (ah !== bh) return ah ? 1 : -1;
        const at = new Date(a['タイムスタンプ']).getTime() || 0;
        const bt = new Date(b['タイムスタンプ']).getTime() || 0;
        return bt - at;
      });
    }

    async function refresh() {
      const el = document.getElementById('contact-list');
      el.innerHTML = '<p class="text-center text-gray-500 py-12 text-lg bg-white border-2 border-gray-300 rounded-2xl">読み込み中...</p>';
      try {
        const res = await client.listContacts();
        contacts = res.rows || [];
        render();
      } catch (err) {
        el.innerHTML = `<p class="text-center text-red-700 py-12 text-lg bg-white border-2 border-red-300 rounded-2xl">読み込めませんでした<br><span class="text-sm">${escapeHtml(err.message)}</span></p>`;
      }
    }

    function render() {
      const pending = contacts.filter(c => !isHandled(c)).length;
      const total = contacts.length;
      document.getElementById('count-pending').textContent = pending + ' 件';
      document.getElementById('count-total').textContent = `（ぜんぶで ${total} 件）`;
      document.getElementById('show-all').checked = showAll;

      const visible = sortContacts(showAll ? contacts : contacts.filter(c => !isHandled(c)));
      const el = document.getElementById('contact-list');

      if (visible.length === 0) {
        if (contacts.length === 0) {
          el.innerHTML = '<p class="text-center text-gray-500 py-12 text-lg bg-white border-2 border-gray-300 rounded-2xl">お問い合わせはまだ届いていません</p>';
        } else {
          el.innerHTML = '<p class="text-center text-gray-500 py-12 text-lg bg-white border-2 border-gray-300 rounded-2xl">未対応のお問い合わせはありません 🎉<br><span class="text-sm">対応済みも見るには上のチェックを入れてください</span></p>';
        }
        return;
      }

      el.innerHTML = visible.map(c => {
        const handled = isHandled(c);
        const cardCls = handled ? 'bg-gray-100 border-2 border-gray-300' : 'bg-white border-4 border-orange-400';
        const badge = handled
          ? '<span class="bg-green-600 text-white px-3 py-1 rounded-full text-sm font-bold">✓ 対応済み</span>'
          : '<span class="bg-red-500 text-white px-3 py-1 rounded-full text-sm font-bold">NEW</span>';
        const toggleBtn = handled
          ? `<button onclick="toggleHandled(${c.rowIndex}, false)" class="w-full bg-gray-500 hover:bg-gray-600 text-white text-xl font-bold py-4 rounded-lg shadow mt-2">↩ 対応中に戻す</button>`
          : `<button onclick="toggleHandled(${c.rowIndex}, true)" class="w-full bg-green-600 hover:bg-green-700 text-white text-xl font-bold py-4 rounded-lg shadow mt-2">✓ 対応済みにする</button>`;
        return `
          <div class="${cardCls} rounded-2xl p-6 shadow">
            <div class="flex flex-wrap items-center gap-3 mb-4">
              ${badge}
              <span class="text-base ${handled ? 'text-gray-500' : 'text-gray-600'}">${escapeHtml(formatTimestamp(c['タイムスタンプ']))}</span>
            </div>
            <table class="w-full text-base mb-4">
              <tr class="border-b border-gray-200">
                <td class="font-bold py-2 w-32 text-gray-600">お名前</td>
                <td class="py-2">${escapeHtml(c['お名前'] || '')} さま</td>
              </tr>
              <tr class="border-b border-gray-200">
                <td class="font-bold py-2 text-gray-600">ご用件</td>
                <td class="py-2">${escapeHtml(c['お問い合わせ種別'] || '(未選択)')}</td>
              </tr>
              <tr>
                <td class="font-bold py-2 text-gray-600">メール</td>
                <td class="py-2">${escapeHtml(c['メールアドレス'] || '')}</td>
              </tr>
            </table>
            <button onclick="openModal(${c.rowIndex})" class="w-full bg-orange-500 hover:bg-orange-600 text-white text-xl font-bold py-4 rounded-lg shadow">
              🔍 ぜんぶ見る
            </button>
            ${toggleBtn}
          </div>
        `;
      }).join('');
    }

    function openModal(rowIndex) {
      const c = contacts.find(x => x.rowIndex === rowIndex);
      if (!c) return;
      modalOpenRowIndex = rowIndex;
      const handled = isHandled(c);
      const email = c['メールアドレス'] || '';
      const subject = c['お問い合わせ種別'] || 'お問い合わせ';
      const body = c['お問い合わせ内容'] || '';
      const tel = c['電話番号'] || '';

      document.getElementById('modal-body').innerHTML = `
        <div class="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
          <div class="text-sm text-gray-500 mb-1">届いた日時</div>
          <div class="text-lg font-bold">${escapeHtml(formatTimestamp(c['タイムスタンプ']))}</div>
        </div>
        <div class="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
          <div class="text-sm text-gray-500 mb-1">お名前</div>
          <div class="text-lg font-bold">${escapeHtml(c['お名前'] || '')} さま</div>
        </div>
        <div class="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
          <div class="text-sm text-gray-500 mb-1">メールアドレス</div>
          <div class="text-lg font-bold">${escapeHtml(email)}</div>
        </div>
        ${tel ? `<div class="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
          <div class="text-sm text-gray-500 mb-1">電話番号</div>
          <div class="text-lg font-bold">${escapeHtml(tel)}</div>
        </div>` : ''}
        <div class="bg-gray-50 border-2 border-gray-200 rounded-lg p-4">
          <div class="text-sm text-gray-500 mb-1">ご用件</div>
          <div class="text-lg font-bold">${escapeHtml(subject)}</div>
        </div>
        <div class="bg-orange-50 border-2 border-orange-200 rounded-lg p-4">
          <div class="text-sm text-gray-500 mb-2">お問い合わせ内容</div>
          <div class="text-base whitespace-pre-wrap leading-relaxed">${escapeHtml(body)}</div>
        </div>
        <div class="bg-${handled ? 'green' : 'yellow'}-50 border-2 border-${handled ? 'green' : 'yellow'}-200 rounded-lg p-4 text-center">
          <div class="text-base font-bold">
            ${handled ? '✓ このお問い合わせは対応済みです' : '⚠ このお問い合わせはまだ未対応です'}
          </div>
        </div>
      `;

      const mailtoSubject = encodeURIComponent('Re: ' + subject);
      const mailtoBody = encodeURIComponent(`${c['お名前'] || ''} さま\n\nお問い合わせいただきありがとうございます。\n\n\n\n--- 元のお問い合わせ ---\n${body}`);
      const mailto = document.getElementById('modal-mailto');
      mailto.href = email ? `mailto:${email}?subject=${mailtoSubject}&body=${mailtoBody}` : '#';
      mailto.style.opacity = email ? '1' : '0.5';

      const toggleBtn = document.getElementById('modal-toggle');
      if (handled) {
        toggleBtn.textContent = '↩ 対応中に戻す';
        toggleBtn.className = 'w-full bg-gray-500 hover:bg-gray-600 text-white text-xl font-bold py-4 rounded-lg shadow';
      } else {
        toggleBtn.textContent = '✓ 対応済みにする';
        toggleBtn.className = 'w-full bg-green-600 hover:bg-green-700 text-white text-xl font-bold py-4 rounded-lg shadow';
      }

      document.getElementById('modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.body.style.overflow = '';
      modalOpenRowIndex = null;
    }

    async function toggleHandled(rowIndex, handled) {
      try {
        await client.markContactHandled(rowIndex, handled);
        showMessage(handled ? '✓ 対応済みにしました' : '✓ 対応中に戻しました', 'success');
        await refresh();
      } catch (err) {
        showMessage('更新できませんでした: ' + err.message, 'error');
      }
    }

    async function toggleHandledFromModal() {
      if (!modalOpenRowIndex) return;
      const c = contacts.find(x => x.rowIndex === modalOpenRowIndex);
      if (!c) return;
      const next = !isHandled(c);
      await toggleHandled(modalOpenRowIndex, next);
      // モーダル再描画
      const updated = contacts.find(x => x.rowIndex === modalOpenRowIndex);
      if (updated) openModal(modalOpenRowIndex);
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = type === 'success'
        ? 'max-w-4xl mx-auto mb-4 p-4 rounded-lg border-2 bg-green-100 border-green-400 text-green-900 text-lg font-bold'
        : 'max-w-4xl mx-auto mb-4 p-4 rounded-lg border-2 bg-red-100 border-red-400 text-red-900 text-lg font-bold';
      clearTimeout(showMessage._t);
      showMessage._t = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    document.getElementById('show-all').addEventListener('change', e => {
      showAll = e.target.checked;
      localStorage.setItem(FILTER_KEY, showAll ? '1' : '0');
      render();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    refresh();
  </script>

</body>
</html>
