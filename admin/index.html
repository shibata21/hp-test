<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面ログイン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #f3f4f6; color: #111; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-white border-2 border-gray-300 rounded-2xl p-8 shadow">

    <h1 class="text-3xl font-bold text-center mb-2">管理画面</h1>
    <p class="text-center text-gray-600 text-lg mb-8">ログインしてください</p>

    <div class="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-4 mb-8">
      <p class="text-base leading-relaxed">
        この画面は <span class="font-bold">お店のスタッフ専用</span> です。<br>
        お客様には見せないでください。
      </p>
    </div>

    <form onsubmit="event.preventDefault(); location.href='dashboard.html';">

      <label class="block mb-8">
        <span class="text-xl font-bold mb-3 block">あいことば</span>
        <input
          type="password"
          placeholder="ここに入力"
          class="w-full border-2 border-gray-400 rounded-lg p-4 text-2xl focus:border-blue-500 focus:outline-none"
          autofocus
        >
      </label>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-5 rounded-lg shadow"
      >
        ログインする
      </button>

    </form>

  </div>

</body>
</html>
